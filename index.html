<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pack Math</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="#" class="logo" id="logoLink">
                    <span class="logo-icon">PM</span>
                    <span class="logo-text">Pack Math</span>
                </a>
                <div class="search-container header-search" id="headerSearch">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="headerSearchInput" placeholder="Search products...">
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Loading State -->
            <div id="loadingState" class="state-container">
                <div class="state-icon loading-pulse">PM</div>
                <p class="state-title">Loading</p>
                <p class="state-description">Fetching product data...</p>
            </div>

            <!-- Error State -->
            <div id="errorState" class="state-container hidden">
                <div class="state-icon">!</div>
                <p class="state-title">Unable to Load Data</p>
                <p class="state-description">Could not connect to the database. Please try again later.</p>
            </div>

            <!-- Landing View -->
            <div id="landingView" class="hidden">
                <div class="landing">
                    <div class="landing-hero">
                        <div class="landing-logo">
                            <span class="landing-logo-icon">PM</span>
                        </div>
                        <h1 class="landing-title">Pack Math</h1>
                        <p class="landing-subtitle">Trading card odds, probabilities, and insights</p>

                        <div class="search-container landing-search">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                            <input type="text" class="search-input" id="landingSearchInput" placeholder="Search for a product...">
                        </div>
                    </div>

                    <!-- Sport Pills -->
                    <div class="sport-pills" id="sportPills"></div>

                    <!-- Recent/Popular Products -->
                    <div class="landing-section">
                        <h2 class="section-title">All Products</h2>
                        <div class="product-grid" id="landingProducts"></div>
                    </div>
                </div>
            </div>

            <!-- Search Results View -->
            <div id="searchView" class="hidden">
                <div class="search-results">
                    <div class="search-header">
                        <button class="back-btn" id="searchBackBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                            Back
                        </button>
                        <span class="search-query" id="searchQueryDisplay"></span>
                    </div>
                    <p class="results-count" id="resultsCount"></p>
                    <div class="product-grid" id="searchResults"></div>
                </div>
            </div>

            <!-- Product View -->
            <div id="productView" class="hidden">
                <div class="product-page">
                    <div class="product-header">
                        <button class="back-btn" id="productBackBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                            Back
                        </button>
                    </div>

                    <!-- Product Hero Card -->
                    <div class="product-hero" id="productHero"></div>

                    <!-- Checklist Section -->
                    <div class="tab-content" id="tabContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
