<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pack Math</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="#" class="logo" id="logoLink">
                    <span class="logo-icon">PM</span>
                    <span class="logo-text">Pack Math</span>
                </a>
                <div class="search-container header-search" id="searchContainer">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="headerSearchInput" placeholder="Search products..." autocomplete="off">
                    <div class="search-dropdown hidden" id="searchDropdown">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="layout">
            <!-- Mobile Sport Pills (< 768px) -->
            <div class="mobile-nav" id="mobileNav">
                <div class="mobile-pills" id="mobileSportPills">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Left Sidebar - Sports Navigation -->
            <aside class="sidebar-left" id="sidebarLeft">
                <nav class="sidebar-nav">
                    <div class="nav-section">
                        <div class="nav-section-title">Sports</div>
                        <ul class="nav-list" id="sportNavList">
                            <!-- Populated by JS -->
                        </ul>
                    </div>
                </nav>
                <div class="sidebar-footer">
                    <a href="about.html" class="footer-link">About</a>
                    <a href="privacy.html" class="footer-link">Privacy Policy</a>
                    <a href="terms.html" class="footer-link">Terms of Service</a>
                    <a href="contact.html" class="footer-link">Contact</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Loading State -->
                <div id="loadingState" class="state-container">
                    <div class="state-icon loading-pulse">PM</div>
                    <p class="state-title">Loading</p>
                    <p class="state-description">Fetching product data...</p>
                </div>

                <!-- Error State -->
                <div id="errorState" class="state-container hidden">
                    <div class="state-icon">!</div>
                    <p class="state-title">Unable to Load Data</p>
                    <p class="state-description">Could not connect to the database. Please try again later.</p>
                </div>

                <!-- Landing View -->
                <div id="landingView" class="hidden">
                    <div class="content-header">
                        <h2 class="content-title" id="contentTitle">All Products</h2>
                    </div>
                    <div class="product-grid" id="landingProducts"></div>
                </div>

                <!-- Search Results View -->
                <div id="searchView" class="hidden">
                    <div class="content-header">
                        <button class="back-btn" id="searchBackBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                            Back
                        </button>
                        <span class="search-query" id="searchQueryDisplay"></span>
                    </div>
                    <p class="results-count" id="resultsCount"></p>
                    <div class="product-grid" id="searchResults"></div>
                </div>

                <!-- Product View -->
                <div id="productView" class="hidden">
                    <div class="content-header">
                        <button class="back-btn" id="productBackBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                            Back
                        </button>
                    </div>

                    <!-- Product Hero Card -->
                    <div class="product-hero" id="productHero"></div>

                    <!-- Checklist Section -->
                    <div class="tab-content" id="tabContent"></div>
                </div>
            </main>

            <!-- Right Sidebar -->
            <aside class="sidebar-right">
                <div class="sidebar-placeholder"></div>
                <div class="sidebar-placeholder"></div>
            </aside>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
